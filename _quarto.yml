project:
  type: book
  output-dir: docs
  resources:
    - data/
    - theme/icons/lucide/LICENSE
    - theme/fonts/OFL.txt

book:
  title: "PDSR"
  author: "E.D. Gennatas"
  date: now
  language: en
  google-analytics: "G-E1FN041JRR"
  repo-url: https://github.com/egenn/pdsr
  repo-subdir: src
  repo-actions: [issue]
  repo-branch: master
  reader-mode: true
  page-footer:
    border: false
    center: |
      <span class="rtemis-footer">
        <a href="https://www.rtemis.org/"><img src="/assets/logomark.svg" alt="rtemis" class="inv"></a>
        <span>© 2025–2026 E.D. Gennatas</span>
      </span>
  search: 
    type: "overlay"
  sidebar:
    logo: assets/logo.svg
    title: " "
    style: "floating"
  chapters:
    - text: "Home"
      href: index.qmd
    - Preface.qmd
    - Introduction.qmd
    - Installation.qmd
    - GettingStarted.qmd
    - IDEs.qmd
    - Packages.qmd
    - BasicOps.qmd
    - DataTypes.qmd
    - DataStructures.qmd
    - Indexing.qmd
    - Factors.qmd
    - part: DataIO.qmd
      chapters:
        - baseDataIO.qmd
        - xlsxIO.qmd
        - dtDataIO.qmd
        - readrDataIO.qmd
        - vroomDataIO.qmd
    - Vectorization.qmd
    - ControlFlow.qmd
    - Summarize.qmd
    - Aggregate.qmd
    - part: Functions.qmd 
      chapters: 
        - WritingFunctions.qmd
        - Scoping.qmd
        - Pipes.qmd
    - Apply.qmd
    # - part: DataQueries.qmd
    #   chapters:
    #     - baseDataQueries.qmd
    #     - dtDataQueries.qmd
        # - dplyrDataQueries.qmd
        # - DuckDBDataQueries.qmd
    - part: DataFrames.qmd
      chapters: 
        - dfBasics.qmd 
        - dfReshape.qmd
        - dfJoins.qmd
    - DataTrans.qmd
    # - MissingData.qmd 
    - Strings.qmd 
    - DateTime.qmd
    - SetOps.qmd
    - ClassesAndOOP.qmd
    - part: DataTable.qmd
      chapters: 
        - dtIntro.qmd
        - dtBasics.qmd
        - dtRefSem.qmd
        - dtReshape.qmd
        - dtJoins.qmd
        - dtAdvanced.qmd
    - part: Tidyverse.qmd
      chapters:
        - dplyrBasics.qmd
        - tidyrReshape.qmd
        - dplyrJoins.qmd
        - lubridate.qmd
    - part: duckplyr.qmd
      chapters:
        - duckplyrBasics.qmd
        - duckplyrReshape.qmd
        - duckplyrJoins.qmd
    - part: Polars.qmd
      chapters:
        - plBasics.qmd
        - plReshape.qmd
        - plJoins.qmd
    - part: Graphics.qmd
      chapters:
        - BaseGraphics.qmd
        - Colors.qmd
        - ggplot2.qmd
        - plotly.qmd
        - rtemis.draw.qmd
    - HypothesisTesting.qmd 
    # - GLM.qmd
    - Profiling.qmd 
    - Quarto.qmd
    - part: System.qmd
      chapters:
        - TerminalIntro.qmd
        - GitHubIntro.qmd 
    - part: Advanced.qmd
      chapters: 
        - ds.qmd
        - DuckDB.qmd
    - Resources.qmd 
    - DataPipeline.qmd
    - CrashCourse.qmd
    - References.qmd

bibliography: references.bib

engine: knitr

format:
  live-html:
    toc: true
    toc-depth: 3
    respect-user-color-scheme: true
    css:
      - theme/fonts.css
      - theme/custom.css
      - theme/webexercises.css
      - theme/rtemis-syntax.css
      - theme/code.css
    theme:
      light: theme/rtemis-light.scss
      dark: theme/rtemis-dark.scss
    syntax-highlighting:
      light: theme/rtemis-light.theme
      dark: theme/rtemis-dark.theme
    include-in-header: include/meta-icons.html
    include-after-body: include/webex.html
    code-link: true
    callout-appearance: simple

execute:
  freeze: auto
